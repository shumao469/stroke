[metadata]
name = nefel-biofeatures
version = 0.1.0
author = Shumao Xu Lab
author_email = shumaoxu@gmail.com
description = Biofeature extraction utilities for IF/IHC images (NEFEL).
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/shumao469/stroke.git/nefel-biofeatures
project_urls =
    Bug Tracker = https://github.com/<your-org>/nefel-biofeatures/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.23
    pandas>=2.0
    scipy>=1.10
    scikit-image>=0.21
    opencv-python>=4.8
    matplotlib>=3.7

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8.0
    black>=24.0
    ruff>=0.5
    build>=1.2
    twine>=5.0

[tool:pytest]
testpaths = tests
