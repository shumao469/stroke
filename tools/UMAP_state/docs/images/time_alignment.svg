<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="390" viewBox="0 0 1240 390"><rect width="1240" height="390" rx="20" fill="#f3f6fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b45}.h{font-size:28px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:16px;fill:#52657a}</style><text x="40" y="55" class="h">Time alignment · the same data, two valid coordinate systems</text><text x="40" y="86" class="s">Example protocol: 60 s baseline + 180 s stimulation + 600 s recovery (blocks not to scale)</text><rect x="190" y="135" width="230" height="68" rx="8" fill="#cbe8ed"/><rect x="420" y="135" width="290" height="68" rx="8" fill="#ffdcb4"/><rect x="710" y="135" width="470" height="68" rx="8" fill="#e0d7f4"/><text x="305" y="175" text-anchor="middle" class="t">PRE · 60 s</text><text x="565" y="175" text-anchor="middle" class="t">STIM · 180 s</text><text x="945" y="175" text-anchor="middle" class="t">POST · 600 s</text><text x="40" y="236" class="s">Aligned time</text><text x="190" y="236" class="s">−60</text><text x="420" y="236" class="s">0</text><text x="710" y="236" class="s">180</text><text x="1160" y="236" class="s">780 s</text><text x="40" y="276" class="s">Recording time</text><text x="190" y="276" class="s">0</text><text x="420" y="276" class="s">60</text><text x="710" y="276" class="s">240</text><text x="1160" y="276" class="s">840 s</text><path d="M420 113v184" stroke="#c26721" stroke-width="2" stroke-dasharray="5 5"/><text x="40" y="338" class="s">Explicit aligned time.npy: --stim-onset 0   |   Generated arange(T)/fs: --stim-onset 60</text><text x="40" y="367" class="s">Intervals include their start and exclude their end. Feature rate is not the raw electrophysiology sampling rate.</text></svg>