[metadata]
name = rtms-eeg-closedloop
version = 0.1.0
description = Task-state rTMS-EEG closed-loop analysis (Python port of MATLAB EEGLAB scripts)
long_description = file: README.md
long_description_content_type = text/markdown
author = Shumao Xu
author_email = shumaoxu@fudan.edu.cn
url = https://github.com/shumao469/stroke
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy
    scipy
    pandas
    matplotlib
    mne
    openpyxl

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    rtms-eeg = rtms_eeg_closedloop.cli:main
