<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><rect width="1200" height="330" rx="20" fill="#f3f6fb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19334c}.h{font-size:27px;font-weight:bold}.t{font-size:21px;font-weight:bold}.s{font-size:17px}</style><text x="35" y="52" class="h">Prediction demo · fixed sample-number split</text><text x="35" y="87" class="s">Each binary task uses two group prefixes; sample numbers determine the subsets.</text><rect x="35" y="120" width="355" height="115" rx="12" fill="#cce9e4"/><rect x="420" y="120" width="355" height="115" rx="12" fill="#e2dcf3"/><rect x="805" y="120" width="355" height="115" rx="12" fill="#ffe5c8"/><text x="55" y="160" class="t">Train · IDs 1 and 2</text><text x="55" y="199" class="s">4 samples total · 2 per class</text><text x="440" y="160" class="t">Test · ID 3</text><text x="440" y="199" class="s">2 samples total · 1 per class</text><text x="825" y="160" class="t">“External” · ID 4</text><text x="825" y="199" class="s">2 samples total · 1 per class</text><text x="35" y="277" class="s">The “External” plot label is not an independent cohort. Feature selection precedes this split.</text><text x="35" y="307" class="s">ROC, calibration, DCA and coefficient-contribution panels illustrate methods, not clinical validity.</text></svg>