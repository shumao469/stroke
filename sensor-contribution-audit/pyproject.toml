[build-system]
requires = ["setuptools==84.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-contribution-audit"
version = "0.1.0"
description = "Analytical timing-error budgets and explicit feature-dimension checks for multimodal sensing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["reportlab==4.4.9", "pypdfium2==5.14.0", "pillow==12.3.0", "charset-normalizer==3.5.2"]

[project.scripts]
sensor-contribution-audit = "sensor_contribution_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensor_contribution_audit = ["data/*.csv", "data/*.json", "data/*.md", "data/reported/*.csv", "data/reported/*.json"]
